name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack plugins
        run: |
          mkdir -p .artifacts
          npm pack ./packages/dsh-codex-subscription --pack-destination .artifacts
          npm pack ./packages/dsh-session-import --pack-destination .artifacts
          npm pack ./dsh-themes --pack-destination .artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .artifacts/*.tgz --generate-notes --verify-tag
