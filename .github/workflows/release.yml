name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Pack plugins
        run: |
          mkdir -p .artifacts
          npm pack . --pack-destination .artifacts
          npm pack ./packages/dsh-codex-subscription --pack-destination .artifacts
          npm pack ./packages/dsh-session-import --pack-destination .artifacts
          npm pack ./packages/dsh-solana-wallet --pack-destination .artifacts
          npm pack ./packages/dsh-terminal --pack-destination .artifacts
          npm pack ./packages/dsh-telegram --pack-destination .artifacts
          npm pack ./dsh-themes --pack-destination .artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .artifacts/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" .artifacts/*.tgz --generate-notes --verify-tag
          fi
      - name: Publish npm package with provenance
        run: npm publish --access public --provenance
